<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual/Physical Keyboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="container">
    <button class="keyboard-toggle">Mark-Codex Virtual</button>
    <div class="keyboard">
      <div class="row function-row">
        <div class="key escape">Esc</div>
        <div class="key function">F1</div>
        <div class="key function">F2</div>
        <div class="key function">F3</div>
        <div class="key function">F4</div>
        <div class="key function">F5</div>
        <div class="key function">F6</div>
        <div class="key function">F7</div>
        <div class="key function">F8</div>
        <div class="key function">F9</div>
        <div class="key function">F10</div>
        <div class="key function">F11</div>
        <div class="key function">F12</div>
      </div>
      <div class="row">
        <div class="key"><span class="shift-char">~</span><span class="main-char">`</span></div>
        <div class="key"><span class="shift-char">!</span><span class="main-char">1</span></div>
        <div class="key"><span class="shift-char">@</span><span class="main-char">2</span></div>
        <div class="key"><span class="shift-char">#</span><span class="main-char">3</span></div>
        <div class="key"><span class="shift-char">$</span><span class="main-char">4</span></div>
        <div class="key"><span class="shift-char">%</span><span class="main-char">5</span></div>
        <div class="key"><span class="shift-char">^</span><span class="main-char">6</span></div>
        <div class="key"><span class="shift-char">&</span><span class="main-char">7</span></div>
        <div class="key"><span class="shift-char">*</span><span class="main-char">8</span></div>
        <div class="key"><span class="shift-char">(</span><span class="main-char">9</span></div>
        <div class="key"><span class="shift-char">)</span><span class="main-char">0</span></div>
        <div class="key"><span class="shift-char">_</span><span class="main-char">-</span></div>
        <div class="key"><span class="shift-char">+</span><span class="main-char">=</span></div>
        <div class="key special">⌫</div>
      </div>
      <div class="row">
        <div class="key"><span class="main-char">Q</span></div>
        <div class="key"><span class="main-char">W</span></div>
        <div class="key"><span class="main-char">E</span></div>
        <div class="key"><span class="main-char">R</span></div>
        <div class="key"><span class="main-char">T</span></div>
        <div class="key"><span class="main-char">Y</span></div>
        <div class="key"><span class="main-char">U</span></div>
        <div class="key"><span class="main-char">I</span></div>
        <div class="key"><span class="main-char">O</span></div>
        <div class="key"><span class="main-char">P</span></div>
        <div class="key"><span class="shift-char">{</span><span class="main-char">[</span></div>
        <div class="key"><span class="shift-char">}</span><span class="main-char">]</span></div>
        <div class="key"><span class="shift-char">|</span><span class="main-char">\</span></div>
      </div>
      <div class="row">
        <div class="key special">Caps</div>
        <div class="key"><span class="main-char">A</span></div>
        <div class="key"><span class="main-char">S</span></div>
        <div class="key"><span class="main-char">D</span></div>
        <div class="key"><span class="main-char">F</span></div>
        <div class="key"><span class="main-char">G</span></div>
        <div class="key"><span class="main-char">H</span></div>
        <div class="key"><span class="main-char">J</span></div>
        <div class="key"><span class="main-char">K</span></div>
        <div class="key"><span class="main-char">L</span></div>
        <div class="key"><span class="shift-char">:</span><span class="main-char">;</span></div>
        <div class="key"><span class="shift-char">"</span><span class="main-char">'</span></div>
        <div class="key special">Enter</div>
      </div>
      <div class="row">
        <div class="key special">Shift</div>
        <div class="key"><span class="main-char">Z</span></div>
        <div class="key"><span class="main-char">X</span></div>
        <div class="key"><span class="main-char">C</span></div>
        <div class="key"><span class="main-char">V</span></div>
        <div class="key"><span class="main-char">B</span></div>
        <div class="key"><span class="main-char">N</span></div>
        <div class="key"><span class="main-char">M</span></div>
        <div class="key"><span class="shift-char">
          </span><span class="main-char">,</span></div>
        <div class="key"><span class="shift-char">></span><span class="main-char">.</span></div>
        <div class="key"><span class="shift-char">?</span><span class="main-char">/</span></div>
        <div class="key special">Shift</div>
      </div>
      <div class="row">
        <div class="key special">Ctrl</div>
        <div class="key special">Alt</div>
        <div class="key space"></div>
        <div class="key special">Alt</div>
        <div class="key special">Ctrl</div>
      </div>
    </div>
    <div class="typing-display" tabindex="0"></div>
  </div>

  <script src="/main.js"></script>
</body>

</html>
